<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ScanMyCreds</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 380px;
    min-height: 480px;
    background: #000;
    color: #fff;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 13px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.96);
  }
  .logo {
    font-size: 11px;
    letter-spacing: 0.2em;
    font-weight: 700;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
  }
  .open-btn {
    padding: 5px 11px;
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .open-btn:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 2px;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    overflow-x: auto;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1;
    padding: 6px 10px;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: all 0.2s;
  }
  .tab:hover { color: rgba(255,255,255,0.6); }
  .tab.active {
    color: #fff;
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.15);
  }

  .panel { display: none; padding: 16px 18px; }
  .panel.active { display: block; }

  /* Section labels */
  .section-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.18);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* Inputs */
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 9px;
    padding: 10px 12px;
    color: #fff;
    font-size: 13px;
    outline: none;
    font-family: inherit;
    transition: all 0.2s;
  }
  input::placeholder { color: rgba(255,255,255,0.2); }
  input:focus {
    border-color: rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.07);
  }

  /* Buttons */
  .btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .btn-primary {
    background: #fff;
    color: #000;
    box-shadow: 0 0 16px rgba(255,255,255,0.15);
  }
  .btn-primary:hover { box-shadow: 0 0 24px rgba(255,255,255,0.25); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  .btn-ghost {
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.08); color: #fff; }

  /* Cards / results */
  .card {
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.02);
    margin-top: 12px;
    position: relative;
    overflow: hidden;
  }
  .card-accent { position: absolute; top: 0; left: 0; right: 0; height: 1px; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .pill-dot { width: 5px; height: 5px; border-radius: 50%; }

  .source-tag {
    display: inline-block;
    margin: 2px;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 10px;
  }

  /* Strength bar */
  .strength-bar {
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    height: 4px;
    overflow: hidden;
    margin: 6px 0 10px;
  }
  .strength-fill { height: 100%; transition: width 0.4s ease; }

  /* Stat grid */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    margin: 10px 0;
  }
  .stat-box {
    padding: 9px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
  }
  .stat-label {
    font-size: 9px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .stat-value {
    font-size: 13px;
    font-weight: 700;
  }

  /* Empty / status states */
  .status {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    text-align: center;
    padding: 8px 0;
  }
  .empty {
    text-align: center;
    padding: 32px 16px;
    color: rgba(255,255,255,0.2);
    font-size: 12px;
  }
  .empty-icon { font-size: 24px; margin-bottom: 10px; opacity: 0.3; }

  /* Range input */
  input[type="range"] {
    width: 100%;
    accent-color: #6c9ef7;
  }
  .range-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .range-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
  }
  .range-value {
    font-size: 12px;
    font-weight: 700;
    color: #fff;
  }

  /* History row */
  .hist-row {
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.05);
    margin-bottom: 6px;
    font-size: 11px;
  }
  .hist-email {
    color: #fff;
    font-weight: 600;
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .hist-meta {
    display: flex;
    justify-content: space-between;
    color: rgba(255,255,255,0.3);
    font-size: 10px;
  }

  .input-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .pw-wrap { position: relative; flex: 1; }
  .pw-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    font-size: 10px;
    font-family: inherit;
  }
  .copy-btn {
    padding: 0 14px;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    font-family: inherit;
    white-space: nowrap;
  }
  .copy-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }

  .checkbox-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 10px 0 14px;
  }
  .checkbox-grid label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
  }
  .checkbox-grid input { accent-color: #6c9ef7; }

  .issue {
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    margin-bottom: 4px;
  }
  .issue-bad { background: rgba(224,92,75,0.08); color: #e05c4b; border: 1px solid rgba(224,92,75,0.15); }
  .issue-info { background: rgba(108,158,247,0.08); color: #6c9ef7; border: 1px solid rgba(108,158,247,0.15); }
</style>
</head>
<body>

<div class="header">
  <span class="logo">SCANMYCREDS</span>
  <button class="open-btn" id="openAppBtn">Open app ↗</button>
</div>

<div class="tabs">
  <button class="tab active" data-tab="scan">Scan</button>
  <button class="tab" data-tab="password">Password</button>
  <button class="tab" data-tab="generator">Generator</button>
  <button class="tab" data-tab="history">History</button>
</div>

<!-- SCAN -->
<div id="tab-scan" class="panel active">
  <div class="section-label">Email scan</div>
  <input type="email" id="scanEmail" placeholder="email@example.com" />
  <div style="height:10px"></div>
  <button class="btn btn-primary" id="scanBtn">Scan email</button>
  <div id="scanResults"></div>
</div>

<!-- PASSWORD HEALTH -->
<div id="tab-password" class="panel">
  <div class="section-label">Password health</div>
  <p style="font-size:11px;color:rgba(255,255,255,0.3);margin-bottom:12px;line-height:1.5">k-anonymity check. Your password never leaves your device.</p>
  <div class="input-row">
    <div class="pw-wrap">
      <input type="password" id="pwInput" placeholder="Enter password to check..." />
      <button class="pw-toggle" id="pwToggle">Show</button>
    </div>
  </div>
  <button class="btn btn-primary" id="pwBtn">Check password</button>
  <div id="pwResults"></div>
</div>

<!-- GENERATOR -->
<div id="tab-generator" class="panel">
  <div class="section-label">Password generator</div>
  <div class="input-row">
    <input type="text" id="genResult" readonly placeholder="Click generate..." style="font-family:monospace;font-size:12px" />
    <button class="copy-btn" id="genCopy">Copy</button>
  </div>
  <div class="range-row">
    <span class="range-label">Length</span>
    <span class="range-value" id="genLenLabel">16</span>
  </div>
  <input type="range" id="genLen" min="8" max="64" value="16" />
  <div class="checkbox-grid">
    <label><input type="checkbox" id="optUpper" checked /> Uppercase</label>
    <label><input type="checkbox" id="optLower" checked /> Lowercase</label>
    <label><input type="checkbox" id="optNum" checked /> Numbers</label>
    <label><input type="checkbox" id="optSym" checked /> Symbols</label>
  </div>
  <button class="btn btn-primary" id="genBtn">Generate password</button>
</div>

<!-- HISTORY -->
<div id="tab-history" class="panel">
  <div class="section-label">Recent scans</div>
  <div id="historyResults"><div class="empty"><div class="empty-icon">📋</div>No scans yet</div></div>
</div>

<script src="popup.js"></script>
</body>
</html>

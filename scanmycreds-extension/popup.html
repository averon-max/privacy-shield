<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ScanMyCreds</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 380px; min-height: 500px; background: #000; color: #f0f0f0; font-family: system-ui, sans-serif; font-size: 13px; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 0.5px solid rgba(255,255,255,0.07); }
.logo { font-size: 13px; font-weight: 700; letter-spacing: 0.15em; color: #fff; }
.open-btn { padding: 4px 10px; border-radius: 6px; border: 0.5px solid rgba(255,255,255,0.1); background: transparent; color: #888; font-size: 11px; cursor: pointer; }
.tabs { display: flex; border-bottom: 0.5px solid rgba(255,255,255,0.07); overflow-x: auto; }
.tab { flex: 1; padding: 10px 8px; font-size: 11px; color: #555; cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; white-space: nowrap; min-width: 70px; }
.tab.active { color: #fff; border-bottom-color: #e05c4b; }
.panel { display: none; padding: 16px; }
.panel.active { display: block; }
input { width: 100%; background: #111; border: 0.5px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 9px 11px; color: #fff; font-size: 13px; outline: none; font-family: inherit; }
.btn { width: 100%; padding: 9px; border-radius: 8px; border: none; font-size: 13px; font-weight: 500; cursor: pointer; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-blue { background: #6c9ef7; color: #fff; }
.btn-red { background: #e05c4b; color: #fff; }
.row { display: flex; gap: 8px; margin-bottom: 10px; }
.card { background: #111; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; border: 0.5px solid rgba(255,255,255,0.07); }
.card-title { font-weight: 500; font-size: 13px; margin-bottom: 4px; }
.card-meta { font-size: 11px; color: #666; }
.tag { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10px; margin: 2px; background: rgba(224,92,75,0.15); color: #e05c4b; }
.empty { text-align: center; padding: 30px 20px; color: #555; font-size: 12px; }
.bar-wrap { background: #1a1a1a; border-radius: 4px; height: 5px; overflow: hidden; margin: 6px 0 10px; }
.bar { height: 100%; transition: width .4s ease; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
.stat { background: #1a1a1a; border-radius: 6px; padding: 8px 10px; }
.stat-l { font-size: 10px; color: #666; }
.stat-v { font-size: 13px; font-weight: 500; margin-top: 2px; }
.issue { padding: 5px 9px; border-radius: 5px; font-size: 11px; margin-bottom: 3px; }
.issue-bad { background: rgba(224,92,75,0.08); color: #e05c4b; }
.issue-good { background: rgba(108,158,247,0.08); color: #6c9ef7; }
.status { font-size: 12px; color: #666; margin-bottom: 8px; }
.eye { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #555; cursor: pointer; font-size: 11px; }
.pw-wrap { position: relative; flex: 1; }
</style>
</head>
<body>

<div class="header">
  <span class="logo">SCANMYCREDS</span>
  <button class="open-btn" id="openAppBtn">Open app ↗</button>
</div>

<div class="tabs">
  <button class="tab active" data-tab="scan">Scan</button>
  <button class="tab" data-tab="password">Password</button>
  <button class="tab" data-tab="generator">Generator</button>
  <button class="tab" data-tab="history">History</button>
</div>

<div id="tab-scan" class="panel active">
  <div class="row">
    <input type="email" id="scanEmail" placeholder="email@example.com" />
  </div>
  <button class="btn btn-red" id="scanBtn">Scan email</button>
  <div class="status" id="scanStatus" style="margin-top:10px"></div>
  <div id="scanResults" style="margin-top:10px"></div>
</div>

<div id="tab-password" class="panel">
  <p style="font-size:11px;color:#888;margin-bottom:10px;line-height:1.5">Check via k-anonymity. Password never leaves your device.</p>
  <div class="row">
    <div class="pw-wrap">
      <input type="password" id="pwInput" placeholder="Enter password..." />
      <button class="eye" id="pwToggle">Show</button>
    </div>
  </div>
  <button class="btn btn-blue" id="pwBtn">Check password</button>
  <div id="pwResults" style="margin-top:14px"></div>
</div>

<div id="tab-generator" class="panel">
  <input id="genResult" readonly placeholder="Click generate..." style="margin-bottom:10px;font-family:monospace" />
  <div style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:5px">
      <span>Length</span><span id="genLenLabel">16</span>
    </div>
    <input type="range" min="8" max="64" value="16" id="genLen" style="width:100%" />
  </div>
  <div class="row" style="margin-bottom:10px">
    <button class="btn btn-blue" id="genBtn">Generate</button>
    <button class="btn" id="genCopy" style="background:transparent;color:#888;border:0.5px solid rgba(255,255,255,0.1)">Copy</button>
  </div>
</div>

<div id="tab-history" class="panel">
  <div id="historyResults"><div class="empty">Loading...</div></div>
</div>

<script src="popup.js"></script>
</body>
</html>
